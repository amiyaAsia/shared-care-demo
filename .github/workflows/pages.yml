name: Verify and deploy separate Amiya Shared Care
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-care-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage exact reviewed browser files
        shell: bash
        env:
          EXPECTED_REPOSITORY: amiyaAsia/shared-care-demo
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REPOSITORY" = "$EXPECTED_REPOSITORY"
          node check-release.mjs --stage
          for script in app.js memory.js story.js scene.js playback.js narration-script.js value-story.js; do
            node --input-type=module --check < "$script"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.repository == 'amiyaAsia/shared-care-demo' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only this repository's Pages site
        id: deployment
        uses: actions/deploy-pages@v4
